<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>College Organizer</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Фоновое видео (исправлено: добавлен тег source для правильной загрузки) -->
    <video id="bg-video" autoplay muted loop playsinline class="bg-media">
        <source src="bg.mp4" type="video/mp4">
    </video>
    
    <!-- Запасной элемент для картинки фона, если выбран не видеофайл -->
    <div id="bg-image" class="bg-media hidden"></div>

    <!-- Шапка приложения -->
    <header class="app-header glass">
        <div class="tabs">
            <button class="tab-btn active" data-tab="calendar">Календарь</button>
            <button class="tab-btn" data-tab="schedule">Расписание</button>
        </div>
        <button class="settings-btn" id="open-settings">⚙️ Настройки</button>
    </header>

    <!-- Основной контейнер -->
    <main class="app-container">

        <!-- Вкладка: Календарь -->
        <section id="calendar-tab" class="tab-content active">
            <!-- Сайдбар с часами -->
            <aside class="sidebar glass">
                <div class="clock-widget">
                    <div id="live-time" class="live-time">00:00:00</div>
                    <div id="live-date" class="live-date">Загрузка...</div>
                </div>
            </aside>

            <!-- Основной блок календаря -->
            <div class="calendar-main glass">
                <div class="calendar-header">
                    <button class="nav-btn" id="prev-month">❮</button>
                    <h2 id="month-year-display">Сентябрь 2026</h2>
                    <button class="nav-btn" id="next-month">❯</button>
                </div>
                <div class="weekdays">
                    <div>Пн</div><div>Вт</div><div>Ср</div><div>Чт</div><div>Пт</div><div>Сб</div><div>Вс</div>
                </div>
                <div class="days-grid" id="days-grid">
                    <!-- Дни генерируются через JS -->
                </div>
            </div>
        </section>

        <!-- Вкладка: Расписание -->
        <section id="schedule-tab" class="tab-content">
            <div class="schedule-container glass">
                <h2>Расписание занятий</h2>
                <div class="schedule-grid" id="schedule-list">
                    <!-- Сюда можно добавить расписание -->
                </div>
                <div class="schedule-actions">
                    <input type="text" id="new-schedule-input" class="schedule-input" placeholder="Добавить пару/задачу...">
                    <button class="action-btn" id="add-schedule-btn">Добавить</button>
                </div>
            </div>
        </section>

    </main>

    <!-- Модальное окно настроек -->
    <div id="settings-modal" class="modal hidden">
        <div class="modal-content glass">
            <h3>Настройки интерфейса</h3>
            <div class="setting-group">
                <label for="bg-url-input">Ссылка на фон (Картинка или MP4 видео):</label>
                <input type="text" id="bg-url-input" placeholder="bg.mp4">
            </div>
            <div class="setting-group">
                <label for="blur-range">Размытие панелей (Glassmorphism Blur): <span id="blur-val">12</span>px</label>
                <input type="range" id="blur-range" min="0" max="30" value="12">
            </div>
            <div class="modal-actions">
                <button class="action-btn secondary" id="close-settings">Закрыть</button>
                <button class="action-btn" id="save-settings">Применить</button>
            </div>
        </div>
    </div>

    <!-- Модальное окно заметок на день -->
    <div id="note-modal" class="modal hidden">
        <div class="modal-content glass">
            <h3 id="note-modal-date">Заметки на дату</h3>
            <textarea id="note-text" placeholder="Введите задачи или заметки..."></textarea>
            <div class="modal-actions">
                <button class="action-btn secondary" id="close-note-modal">Отмена</button>
                <button class="action-btn" id="save-note-btn">Сохранить</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
