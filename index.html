<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>College Organizer</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-wrapper">
        <!-- Шапка с навигацией по вкладкам -->
        <header class="app-header">
            <div class="nav-tabs">
                <button class="tab-btn active" data-tab="calendar-section">Календарь</button>
                <button class="tab-btn" data-tab="schedule-section">Расписание</button>
            </div>
            <div class="status-widget">
                <span id="current-date-time">02.09.2026 • 00:00:00</span>
            </div>
        </header>

        <!-- ВКЛАДКА 1: Календарь и Заметки -->
        <section id="calendar-section" class="tab-content active">
            <h2>Календарь и напоминания</h2>
            <!-- Твой текущий код календаря и формы отправки в Telegram -->
            <div class="calendar-card">
                <!-- Здесь твои элементы календаря -->
                <p>Здесь располагается календарь и выбор даты для заметок.</p>
            </div>
        </section>

        <!-- ВКЛАДКА 2: Расписание -->
        <section id="schedule-section" class="tab-content">
            <div class="schedule-header">
                <h2>Расписание техникума <span class="badge">v1.00</span></h2>
            </div>

            <div class="table-responsive">
                <table class="schedule-table">
                    <thead>
                        <tr>
                            <th>№</th>
                            <th>Время</th>
                            <th>Пн</th>
                            <th>Вт</th>
                            <th>Ср</th>
                            <th>Чт</th>
                            <th>Пт</th>
                            <th>Сб</th>
                            <th>Вс</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr>
                            <td>1</td>
                            <td class="time-cell">08:30 - 10:00</td>
                            <td><input type="text" class="schedule-input" placeholder="-"></td>
                            <td><input type="text" class="schedule-input" placeholder="-"></td>
                            <td><input type="text" class="schedule-input" value="История"></td>
                            <td><input type="text" class="schedule-input" value="Оси.роб.БПЛА"></td>
                            <td><input type="text" class="schedule-input" placeholder=""></td>
                            <td><input type="text" class="schedule-input" value="Ин. яз"></td>
                            <td><input type="text" class="schedule-input" placeholder=""></td>
                        </tr>
                        <!-- Остальные строки расписания аналогично -->
                    </tbody>
                </table>
            </div>

            <div class="schedule-actions">
                <button id="save-schedule-btn" class="btn-dark">Сохранить</button>
                <button id="clear-schedule-btn" class="btn-red">Очистить</button>
            </div>
        </section>
    </div>

    <script src="script.js"></script>
</body>
</html>
