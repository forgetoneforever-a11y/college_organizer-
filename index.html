<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Календарь Заметок</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="app-container">
        <aside class="sidebar glass">
            <div class="live-clock-container">
                <div id="live-time" class="live-time">00:00:00</div>
                <div id="live-date" class="live-date">Загрузка даты...</div>
            </div>
        </aside>

        <main class="calendar-main glass">
            <header class="calendar-header">
                <button id="prev-month">◀</button>
                <h1 id="month-year">Месяц Год</h1>
                <button id="next-month">▶</button>
            </header>
            
            <div class="weekdays">
                <div>Пн</div><div>Вт</div><div>Ср</div><div>Чт</div><div>Пт</div><div>Сб</div><div>Вс</div>
            </div>
            
            <div class="days-grid" id="days-grid"></div>
        </main>
    </div>

    <!-- Модальное окно для заметок и Telegram-будильника -->
    <div id="note-modal" class="modal hidden">
        <div class="modal-content glass">
            <h3 id="modal-date-title">Заметки на дату</h3>
            <textarea id="note-text" placeholder="Введите заметку на этот день..."></textarea>
            
            <div class="alarm-section" style="margin-top: 15px;">
                <label style="font-size: 14px; display: block; margin-bottom: 5px;">⏰ Будильник в Telegram:</label>
                <div style="display: flex; gap: 10px;">
                    <input type="date" id="alarm-date" style="padding: 6px; border-radius: 6px; border: 1px solid rgba(255,255,255,0.2); background: rgba(0,0,0,0.2); color: #fff; flex: 1;">
                    <input type="time" id="alarm-time" style="padding: 6px; border-radius: 6px; border: 1px solid rgba(255,255,255,0.2); background: rgba(0,0,0,0.2); color: #fff; width: 110px;">
                </div>
            </div>

            <div class="modal-buttons" style="margin-top: 20px;">
                <button id="save-note-btn">Сохранить</button>
                <button id="close-modal-btn">Закрыть</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
